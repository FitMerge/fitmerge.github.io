name: Tests

on:
  push:
    branches: [claude/fitness-app-macros-workouts-z46rpp]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The sync script merges into stored workout history, so its offline checks
      # run here too. --self-test needs no network and no Garmin credentials.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/garmin-sync.py --self-test
